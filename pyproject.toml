[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dometic-pi-control"
version = "1.0.0"
description = "Dometic 39424.602 control daemon for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "RPi.GPIO>=0.7",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
dometic = "dometic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
